<!-- Sidebar container -->
<div class="d-flex flex-column bg-white shadow-sm" 
     style="width: 200px; height: 100vh; position: fixed; top: 0; left: 0; overflow-y: auto;">
  
  <!-- Header Section with Logo Image -->
  <header class="d-flex align-items-center p-3 border-bottom" style="position: sticky; top: 0; z-index: 10;">
    <img
      src="assets/images/mini-logo.png"
      alt="TickIT Logo"
      style="max-height: 40px;"
      class="img-fluid"
    />
  </header>
  
  <!-- Navigation Menu -->
  <nav class="flex-grow-1 p-2">
    <ul class="nav nav-pills flex-column">
      <li class="nav-item">
        <a class="nav-link mb-1" 
           [class.active]="activeItem === 'dashboard'" 
           routerLink="/ticketing"
           (click)="setActiveItem('dashboard')">
          <i class="fas fa-tachometer-alt me-2"></i>
          Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link mb-1" 
           [class.active]="activeItem === 'tickets'" 
           routerLink="/ticketing#tickets"
           (click)="setActiveItem('tickets')">
          <i class="fas fa-ticket-alt me-2"></i>
          Tickets
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link mb-1" 
           [class.active]="activeItem === 'analytics'" 
           routerLink="/ticketing#analytics"
           (click)="setActiveItem('analytics')">
          <i class="fas fa-chart-bar me-2"></i>
          Analytics
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link mb-1" 
           [class.active]="activeItem === 'ai-insights'" 
           routerLink="/ticketing#ai-insights"
           (click)="setActiveItem('ai-insights')">
          <i class="fas fa-robot me-2"></i>
          AI Insights
        </a>
      </li>
    </ul>
  </nav>
  
  <!-- User Profile Footer -->
  <footer class="p-3 border-top" style="position: sticky; bottom: 0; z-index: 10;">
    <div class="d-flex align-items-center mb-3">
      <!-- Avatar Circle: Replace initials with an image if needed -->
      <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center me-2" 
           style="width: 55px; height: 40px;">
        <span class="text-white">JD</span>
      </div>
      <!-- Stacked user info -->
      <div>
        <div class="fw-bold">John Doe</div>
        <div class="small text-muted">Support Agent / Team Alpha</div>
      </div>
    </div>
    <div class="d-flex justify-content-between">
      <!-- Action Icons -->
      <button class="btn btn-light btn-sm" title="Toggle theme" (click)="toggleTheme()">
        <i class="fas fa-adjust"></i>
      </button>
      <button class="btn btn-light btn-sm" title="Change language">
        <i class="fas fa-language"></i>
      </button>
      <button class="btn btn-light btn-sm" title="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </footer>
</div>
