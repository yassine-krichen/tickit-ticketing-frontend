<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h5 class="card-title mb-0">
            <i class="fas fa-history me-2 text-primary"></i> Activity Timeline
        </h5>
    </div>
    <div class="card-body">
        <div class="timeline-vertical">
            <ng-container *ngFor="let event of events; let i = index">
                <div class="timeline-item d-flex position-relative mb-4">
                    <!-- Icon Column -->
                    <div class="timeline-icon-wrapper d-flex flex-column align-items-center me-3">
                        <div class="timeline-icon rounded-circle d-flex align-items-center justify-content-center"
                             [ngStyle]="{'background-color': getActionColor(event.action)}">
                            <i class="fas" [ngClass]="getActionIcon(event.action)"></i>
                        </div>
                        <!-- Connector Line -->
                        <div *ngIf="i < events.length - 1" class="connector"></div>
                    </div>
                    <!-- Content Column -->
                    <div class="timeline-content flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1 fw-bold">{{ event.title }}</h6>
                            <small class="text-muted">{{ event.time }}</small>
                        </div>
                        <div class="text-secondary" *ngIf="event.type !== 'status-change' || !event.additionalData?.from">
                            {{ event.description }}
                        </div>
                        <div class="status-change" *ngIf="event.type === 'status-change' && event.additionalData?.from">
                            <span class="status-label">Status changed from</span>
                            <span class="status-badge badge bg-secondary me-2">{{ event.additionalData.from }}</span>
                            <i class="fas fa-arrow-right mx-1"></i>
                            <span class="status-badge badge" [ngStyle]="{'background-color': getActionColor(event.action)}">{{ event.additionalData.to }}</span>
                        </div>
                    </div>
                </div>
            </ng-container>
            
            <!-- Empty state when no events -->
            <div *ngIf="!events || events.length === 0" class="text-center py-4">
                <i class="fas fa-clock text-muted fa-2x mb-3"></i>
                <p class="text-muted">No activity recorded yet</p>
            </div>
        </div>
    </div>
</div>
