<div class="card mb-3 shadow-sm">
  <div class="card-header bg-white">
    <h5 class="mb-0">
      <i class="fas fa-history me-2 text-primary"></i> Case History Timeline
    </h5>
  </div>
  <div class="card-body">
    <div class="timeline">
      <div *ngIf="steps.length === 0" class="text-center text-muted py-3">
        <i class="fas fa-info-circle me-2"></i> No history records available
      </div>
      
      <div class="timeline-item" *ngFor="let step of steps; let i = index">
        <div class="timeline-badge">
            <i [ngClass]="[getIconClass(step), 'fa', getIcon(step)]"></i>
        </div>
        <div class="timeline-content">
          <h6 class="mb-1">{{ formatTitle(step) }}</h6>
          <div class="text-muted small mb-1">
            {{ step.timestamp | date:'MMM d, y HH:mm' }} WAT
          </div>
          <div class="text-muted smaller mb-2">
            <small>{{ formatUserFingerprint(step.userFingerprint) }}</small>
          </div>
          <p *ngIf="step.dataSnapshot?.commentaire" class="mb-0 text-secondary">
            {{ step.dataSnapshot.commentaire }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
