<div class="ai-recommendations">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="card-title mb-0">AI Recommendations</h5>
        <button
          class="btn btn-primary"
          (click)="generateRecommendations()"
          [disabled]="loading || !ticketId"
        >
          <i class="fas fa-magic me-2"></i>
          {{ loading ? "Analyzing..." : "Get Recommendations" }}
        </button>
      </div>

      <!-- Loading State -->
      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted mt-2">Analyzing ticket data...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="error" class="alert alert-danger">
        <i class="fas fa-exclamation-circle me-2"></i>
        {{ error }}
      </div>

      <!-- Results -->
      <div *ngIf="recommendations" class="recommendations-results">
        <div class="meta-info mb-3 text-muted small">
          <i class="fas fa-clock me-1"></i>
          Generated on: {{ recommendations.timestamp | date : "medium" }} |
          <i class="fas fa-search me-1"></i>
          {{ recommendations.similarCasesFound }} similar cases found |
          <i class="fas fa-chart-line me-1"></i>
          {{ recommendations.confidenceScore * 100 | number : "1.0-0" }}%
          confidence
        </div>

        <div
          class="suggestions-content"
          [innerHTML]="recommendations.suggestions | lineBreaks"
        ></div>
      </div>
    </div>
  </div>
</div>
