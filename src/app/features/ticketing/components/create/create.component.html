<!-- create.component.html -->
<div class="create-ticket-container container-fluid py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <button class="btn btn-outline-secondary btn-sm me-2" (click)="onBackClick()">
          <i class="fas fa-arrow-left me-1"></i> Back
        </button>
        <span class="fs-5 fw-semibold align-middle">
          {{ isEditMode ? 'Edit Ticket' : 'Create New Ticket' }}
        </span>
      </div>
    </div>
  
    <!-- Tip alert shown only in create mode -->
    <div *ngIf="!isEditMode" class="alert position-relative rounded" style="border-left: 4px solid #1e40af; background-color: #e0ecfc; border-radius: 0; padding: 1rem 2rem 1rem 1.5rem; margin: 1rem 0; color: #1e40af;">
      <button type="button" class="btn-close position-absolute" style="top: 0.5rem; right: 0.5rem; font-size: 0.75rem;" (click)="dismissTip()"></button>
      <div class="d-flex align-items-start gap-3">
        <div>
          <div class="mb-2 fw-medium">Quick Tip</div>
          <p class="m-0" style="font-size: 0.875rem; color: #1e40af;">
            Creating a ticket from the Treatment Act page will auto-fill this form with relevant data, saving you time and ensuring accuracy.
          </p>
        </div>
      </div>
    </div>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom-0">
          <h5 class="mb-0 d-flex align-items-center">
            <i class="fas fa-ticket-alt text-primary me-2"></i>
            Ticket Details
          </h5>
        </div>
        <div class="card-body">
          <!-- Row 1: Title & Category -->
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="ticketTitle" class="form-label fw-semibold">
                Title <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="fas fa-heading"></i>
                </span>
                <input type="text" class="form-control" id="ticketTitle" formControlName="title" placeholder="Enter a brief, descriptive title" />
              </div>
            </div>
            <div class="col-md-4">
              <label for="ticketCategory" class="form-label fw-semibold">Category</label>
              <select class="form-select" id="ticketCategory" formControlName="category">
                <option value="" disabled>Select Category</option>
                <option value="Bug">Bug</option>
                <option value="Feature">Feature</option>
                <option value="Improvement">Improvement</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          
          <!-- Row 2: Priority, Status & Treatment Act Id -->
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label for="ticketPriority" class="form-label fw-semibold">Priority</label>
              <select class="form-select" id="ticketPriority" formControlName="priority">
                <option value="" disabled>Select Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="ticketStatus" class="form-label fw-semibold">Status</label>
              <select class="form-select" id="ticketStatus" formControlName="status">
                <option value="" disabled>Select Status</option>
                <option value="Open">Open</option>
                <option value="In-Progress">In-Progress</option>
                <option value="Blocked">Blocked</option>
                <option value="Resolved">Resolved</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="treatmentActId" class="form-label fw-semibold">Treatment Act Id</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="fas fa-id-badge"></i>
                </span>
                <input type="text" class="form-control" id="treatmentActId" formControlName="treatmentActId" placeholder="Enter Treatment Act Id" />
              </div>
            </div>
          </div>
          
          <!-- Row 3: Description -->
          <div class="mb-4">
            <label for="ticketDescription" class="form-label fw-semibold">Description</label>
            <textarea class="form-control" id="ticketDescription" formControlName="description" rows="4" placeholder="Provide a detailed description or steps to reproduce..."></textarea>
          </div>
        </div>
      </div>
    
      <!-- Form Actions -->
      <div class="mt-4 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
          <i class="fas fa-ban me-1"></i> Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save me-1"></i> {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
