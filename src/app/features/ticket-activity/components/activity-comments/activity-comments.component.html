<div class="comments-section">
  <h5 class="mb-4"><i class="fas fa-comments me-2"></i>Comments</h5>

  <!-- Comments List -->
  <div class="comments-list">
    <div class="comment-card" *ngFor="let comment of comments">
      <div class="comment-header">
        <div class="user-info">
          <img [src]="comment.userAvatar || 'assets/images/default-avatar.png'"
               alt="User avatar"
               class="avatar">
          <div>
            <h6 class="mb-0">{{comment.username}}</h6>
            <small class="text-muted">{{comment.createdAt | date:'medium'}}</small>
          </div>
        </div>
        <button class="btn btn-link text-danger"
                *ngIf="comment.canDelete"
                (click)="deleteComment(comment.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
      <div class="comment-content">
        {{comment.content}}
      </div>
    </div>

    <!-- Empty State -->
    <div class="text-center py-4" *ngIf="comments.length === 0">
      <i class="fas fa-comments fa-3x text-muted mb-3"></i>
      <p class="text-muted">No comments yet. Be the first to comment!</p>
    </div>
  </div>

  <!-- Comment Form -->
  <form [formGroup]="commentForm" (ngSubmit)="onSubmit()" class="comment-form">
    <div class="form-group">
      <textarea
        class="form-control"
        formControlName="content"
        rows="3"
        placeholder="Write a comment..."
        [class.is-invalid]="commentForm.get('content').invalid && commentForm.get('content').touched">
      </textarea>
      <div class="invalid-feedback" *ngIf="commentForm.get('content').invalid && commentForm.get('content').touched">
        Please enter a comment.
      </div>
    </div>
    <div class="d-flex justify-content-end mt-3">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!isFormValid || submitting">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="submitting"></span>
        Add Comment
      </button>
    </div>
  </form>

  <!-- Error Message -->
  <div class="alert alert-danger mt-3" *ngIf="error">
    <i class="fas fa-exclamation-triangle me-2"></i>
    {{error}}
  </div>
</div>
