<div class="comments-section">

  <!-- Comments List -->
  <div class="comments-list">
    <div class="comment-card" *ngFor="let comment of comments">
      <div class="comment-header">
        <div class="user-info">
            <div class="avatar-container d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ddd; overflow: hidden; margin-right: 12px; background: #f8f9fa;">
              <ng-container *ngIf="comment.userAvatar; else defaultAvatar">
                <img [src]="comment.userAvatar"
                     (error)="comment.userAvatar = null"
                     class="avatar"
                     style="width: 100%; height: 100%; object-fit: cover;">
              </ng-container>
              <ng-template #defaultAvatar>
                <i class="fa-solid fa-user text-muted" style="font-size: 1.5em;"></i>
              </ng-template>
            </div>
          <div>
            <h6 class="mb-0">{{comment.username}}</h6>
            <small class="text-muted">{{comment.createdAt | date:'medium'}}</small>
          </div>
        </div>
        <button class="btn btn-link text-danger"
                *ngIf="comment.canDelete"
                (click)="deleteComment(comment.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
      <div class="comment-content">
        {{comment.content}}
      </div>
    </div>

    <!-- Empty State -->
    <div class="text-center py-4" *ngIf="comments.length === 0">
      <i class="fas fa-comments fa-3x text-muted mb-3"></i>
      <p class="text-muted">No comments yet. Be the first to comment!</p>
    </div>
  </div>

  <!-- Collapsible Comment Form -->
  <button class="btn btn-outline-secondary" type="button" (click)="showCommentForm = !showCommentForm">
    <i class="fa" [ngClass]="showCommentForm ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
    {{ showCommentForm ? 'Hide' : 'Add a Comment' }}
  </button>
  <div *ngIf="showCommentForm">
    <form [formGroup]="commentForm" (ngSubmit)="onSubmit()" class="comment-form">
      <div class="form-group">
        <textarea
          class="form-control"
          formControlName="content"
          rows="3"
          placeholder="Write a comment..."
          [class.is-invalid]="commentForm.get('content').invalid && commentForm.get('content').touched">
        </textarea>
        <div class="invalid-feedback" *ngIf="commentForm.get('content').invalid && commentForm.get('content').touched">
          Please enter a comment.
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="!isFormValid || submitting">
          <span class="spinner-border spinner-border-sm me-2" *ngIf="submitting"></span>
          Add Comment
        </button>
      </div>
    </form>
  </div>

  <!-- Error Message -->
  <div class="alert alert-danger mt-3" *ngIf="error">
    <i class="fas fa-exclamation-triangle me-2"></i>
    {{error}}
  </div>
</div>

<!-- Add this at the end of your component template -->
<div class="modal fade" id="deleteCommentModal" tabindex="-1" aria-labelledby="deleteCommentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteCommentModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this comment?</p>
        <p class="small text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-danger" (click)="confirmDeleteComment()">
          <i class="fas fa-trash me-1"></i>Delete
        </button>
      </div>
    </div>
  </div>
</div>
