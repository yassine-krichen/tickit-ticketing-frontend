<div class="modal fade" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-cloud-upload-alt me-2 text-primary"></i> Upload Files
                </h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
            </div>
            
            <div class="modal-body">
                <!-- Drag & Drop Area -->
                <div 
                    class="drop-zone mb-4" 
                    [class.drag-over]="dragOver"
                    [class.has-files]="selectedFiles.length > 0"
                    (dragover)="$event.preventDefault(); $event.stopPropagation(); dragOver = true;" 
                    (dragleave)="$event.preventDefault(); $event.stopPropagation(); dragOver = false;" 
                    (drop)="handleDrop($event)" 
                    (click)="fileInput.click()">
                    
                    <input 
                        #fileInput 
                        type="file" 
                        class="d-none" 
                        multiple 
                        accept="image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" 
                        (change)="onFilesSelected($event)">
                    
                    <div class="text-center p-4">
                        <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-primary"></i>
                        <p class="mb-1">Drag and drop files here or click to browse</p>
                        <p class="text-muted small mb-0">Maximum file size: 10MB</p>
                        <p class="text-muted small">Supported formats: JPG, PNG, GIF, PDF, DOC, DOCX, TXT</p>
                    </div>
                </div>

                <!-- Selected Files List -->
                <div class="selected-files mb-3" *ngIf="selectedFiles.length > 0">
                    <h6 class="mb-3">
                        <i class="fas fa-paperclip me-2"></i> 
                        Selected Files ({{ selectedFiles.length }})
                    </h6>
                    
                    <div class="row g-3">
                        <div class="col-md-4" *ngFor="let file of selectedFiles; let i = index">
                            <div class="file-card p-3 border rounded h-100 position-relative">
                                <!-- Preview for images -->
                                <div *ngIf="previewUrls[file.name]" class="text-center mb-2">
                                    <img [src]="previewUrls[file.name]" class="img-preview rounded" alt="Preview">
                                </div>
                                
                                <!-- Icon for non-images -->
                                <div *ngIf="!previewUrls[file.name]" class="text-center mb-2">
                                    <i class="fas fa-3x" [ngClass]="getFileIconClass(file)"></i>
                                </div>
                                
                                <!-- File info -->
                                <div class="text-center">
                                    <p class="mb-1 text-truncate" title="{{file.name}}">{{file.name}}</p>
                                    <p class="text-muted small mb-0">{{formatFileSize(file.size)}}</p>
                                </div>
                                
                                <!-- Remove button -->
                                <button type="button" class="btn-close position-absolute top-0 end-0 m-2"
                                    aria-label="Remove" (click)="removeFile(i); $event.stopPropagation()"></button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Error Message -->
                <div class="alert alert-danger" *ngIf="error">
                    <i class="fas fa-exclamation-circle me-2"></i> {{error}}
                </div>
                
                <!-- Upload Progress -->
                <div class="progress mb-3" *ngIf="uploading">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" 
                         role="progressbar" 
                         [style.width.%]="uploadProgress"
                         [attr.aria-valuenow]="uploadProgress" 
                         aria-valuemin="0" 
                         aria-valuemax="100">
                        {{uploadProgress}}%
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
                <button type="button" class="btn btn-primary" 
                        [disabled]="selectedFiles.length === 0 || uploading"
                        (click)="uploadFiles()">
                    <span *ngIf="!uploading">
                        <i class="fas fa-upload me-1"></i> Upload
                    </span>
                    <span *ngIf="uploading">
                        <i class="fas fa-spinner fa-spin me-1"></i> Uploading...
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="isVisible"></div>
