<div class="modal" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Upload File</h5>
        <button type="button" class="btn-close" (click)="cancel()"></button>
      </div>
      <div class="modal-body">
        <!-- Drag & Drop Area -->
        <div
          class="drop-zone"
          [class.drag-over]="dragOver"
          [class.has-file]="selectedFile"
          (dragover)="$event.preventDefault(); $event.stopPropagation(); dragOver = true;"
          (dragleave)="$event.preventDefault(); $event.stopPropagation(); dragOver = false;"
          (drop)="handleDrop($event)"
          (click)="fileInput.click()">

          <input
            #fileInput
            type="file"
            class="d-none"
            accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx"
            (change)="onFileSelected($event)">

          <!-- Empty State -->
          <div class="text-center p-4" *ngIf="!selectedFile">
            <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-primary"></i>
            <p class="mb-2">Drag and drop files here</p>
            <p class="text-muted small mb-0">or click to browse</p>
            <p class="text-muted small">Supported formats: Images, PDF, DOC, DOCX, TXT, XLS, XLSX</p>
          </div>

          <!-- File Preview -->
          <div class="selected-file p-3 text-center" *ngIf="selectedFile">
            <!-- Image Preview -->
            <div *ngIf="previewUrl" class="mb-3">
              <img [src]="previewUrl" alt="Preview" class="img-preview rounded">
            </div>

            <!-- File Icon -->
            <div *ngIf="!previewUrl" class="mb-3">
              <i class="fas fa-file fa-3x text-secondary"></i>
            </div>

            <!-- File Info -->
            <div class="file-info">
              <p class="mb-1 text-truncate">{{selectedFile.name}}</p>
              <p class="text-muted small mb-0">{{(selectedFile.size / 1024 / 1024).toFixed(2)}} MB</p>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div class="alert alert-danger mt-3" *ngIf="error">
          <i class="fas fa-exclamation-triangle me-2"></i>
          {{error}}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="!selectedFile || uploading"
          (click)="uploadFile()">
          <span *ngIf="uploading" class="spinner-border spinner-border-sm me-2"></span>
          {{uploading ? 'Uploading...' : 'Upload'}}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="isVisible"></div>
