<div class="ticket-activity-edit-layout">
  <app-sidebar></app-sidebar>

  <div class="content-area ">
    <form [formGroup]="activityForm" (ngSubmit)="onSubmit()" class="activity-form">
      <div class="card">
        <div class="card-header">
          <h5>Edit Activity</h5>
        </div>
        <div class="card-body">
          <!-- Loading state -->
          <div *ngIf="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Loading activity details...</p>
          </div>

          <!-- Error state -->
          <div *ngIf="error" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            {{ error }}
          </div>

          <!-- Activity Type -->
          <div class="mb-3" *ngIf="!loading">
            <label for="type" class="form-label">Activity Type</label>
            <select class="form-select" id="type" formControlName="type">
              <option value="">Select Type</option>
              <option value="OPEN">Open</option>
              <option value="CLOSE">Close</option>
              <option value="UPDATE">Update</option>
              <option value="EMAIL">Email</option>
              <option value="CALL">Call</option>
              <option value="RESEARCH">Research</option>
              <option value="ASSIGNMENT">Assignment</option>
              <option value="OTHER">Other</option>
            </select>
            <div class="text-danger" *ngIf="activityForm.get('type').touched && activityForm.get('type').errors?.required">
              Activity type is required
            </div>
          </div>

          <!-- Description -->
          <div class="mb-3" *ngIf="!loading">
            <label for="description" class="form-label">Description</label>
            <textarea
              class="form-control"
              id="description"
              rows="4"
              formControlName="description"
              placeholder="Enter activity description..."></textarea>
            <div class="text-danger" *ngIf="activityForm.get('description').touched && activityForm.get('description').errors?.required">
              Description is required
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="card-footer form-actions">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">
            <i class="fas fa-ban me-1"></i> Cancel
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="!activityForm.valid || loading">
            <i class="fas fa-save me-1"></i> Save Changes
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
