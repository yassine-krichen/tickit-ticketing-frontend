<!-- Loading state -->
<div class="text-center p-5" *ngIf="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Loading notifications...</p>
</div>

<!-- Error state -->
<div class="alert alert-danger" *ngIf="loadingError">
    <i class="fas fa-exclamation-triangle me-2"></i>
    Failed to load notifications. Please try again.
    <button class="btn btn-sm btn-danger ms-3" (click)="retry()">
        <i class="fas fa-sync-alt me-1"></i> Retry
    </button>
</div>

<!-- Empty state -->
<div class="empty-state text-center p-5" *ngIf="!loading && !loadingError && notifications.length === 0">
    <div class="empty-state-icon mb-3">
        <i class="fas fa-bell-slash fa-3x text-muted"></i>
    </div>
    <h4>No notifications found</h4>
    <p class="text-muted">
        There are no notifications matching your current filters.
    </p>
</div>

<!-- Notification list -->
<div class="notification-list-container" *ngIf="!loading && !loadingError && notifications.length > 0">
    <div class="row">
        <div class="col-md-12" *ngFor="let notification of notifications">
            <app-notification-item 
                [notification]="notification"
                [isNewlyArrived]="isNewlyArrived(notification.id)"
                (markRead)="markNotificationAsRead(notification.id, $event)"
                (delete)="deleteNotificationItem(notification.id, $event)">
            </app-notification-item>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4" *ngIf="totalCount > 0">
        <div *ngIf="totalCount <= pageSize" class="text-muted small">
            Showing all {{totalCount}} item(s)
        </div>
        
        <!-- Custom pagination (replacing ngb-pagination) -->
        <nav aria-label="Notifications pagination" *ngIf="totalCount > pageSize">
            <ul class="pagination pagination-sm">
                <!-- First page -->
                <li class="page-item" [class.disabled]="currentPage === 1">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(1)" aria-label="First">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>
                
                <!-- Previous page -->
                <li class="page-item" [class.disabled]="currentPage === 1">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage - 1)" aria-label="Previous">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>
                
                <!-- Page numbers -->
                <ng-container *ngFor="let page of getPageRange()">
                    <li class="page-item" [class.active]="currentPage === page" *ngIf="page !== -1">
                        <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page)">
                            {{ page }}
                        </a>
                    </li>
                    <li class="page-item disabled" *ngIf="page === -1">
                        <span class="page-link">...</span>
                    </li>
                </ng-container>
                
                <!-- Next page -->
                <li class="page-item" [class.disabled]="currentPage === getPageCount()">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage + 1)" aria-label="Next">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>
                
                <!-- Last page -->
                <li class="page-item" [class.disabled]="currentPage === getPageCount()">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(getPageCount())" aria-label="Last">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this notification?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-danger" (click)="confirmDelete()">
                    <i class="fas fa-trash me-1"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>
