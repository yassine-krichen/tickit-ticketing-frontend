<div class="search-container">
  <div class="input-group">
    <div class="dropdown">
      <button type="button" class="btn dropdown-toggle" (click)="toggleDropdown($event)">
        {{ getCategoryLabel() }}
      </button>
      <ul class="dropdown-menu" [ngClass]="{'show': isDropdownOpen}">
        <li *ngFor="let category of searchCategories">
          <button class="dropdown-item" type="button" (click)="onCategoryChange(category.value, $event)">
            {{ category.label }}
          </button>
        </li>
      </ul>
    </div>
    <span class="input-group-text bg-light border-end-0">
      <i class="fas fa-search text-muted"></i>
    </span>
    <input
      type="text"
      class="form-control border-start-0" 
      [placeholder]="'Search tickets by ' + getCategoryLabel() + '...'"
      (input)="onSearchChange($any($event.target).value)"
      [value]="searchTerm"
    >
    <button class="btn btn-outline-secondary clear-search-btn" (click)="clearSearch()">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>
