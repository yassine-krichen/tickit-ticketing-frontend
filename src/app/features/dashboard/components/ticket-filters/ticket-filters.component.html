<div class="d-flex align-items-center border-bottom pb-2">
  <ul class="nav nav-tabs border-0 flex-grow-1">
    <li class="nav-item" *ngFor="let tab of tabs">
      <button 
        class="nav-link" 
        [class.active]="activeTab === tab.id" 
        (click)="setActiveTab(tab.id)">
        <i [class]="tab.icon + ' me-1'"></i> {{ tab.label }}
      </button>
    </li>
  </ul>
  
  <div class="d-flex align-items-center">
    <!-- Combined Order By Dropdown with Direction -->
    <div class="dropdown" (click)="$event.stopPropagation()">
      <button class="btn btn-sm btn-light" (click)="toggleOrderByDropdown($event)" style="min-width: 140px">
        <i class="fas fa-sort me-1"></i> 
        Order by: {{ getOrderByLabel() }} 
        <i class="fas ms-1" [ngClass]="getDirectionIcon()"></i>
      </button>
      <div class="dropdown-menu dropdown-menu-end" [class.show]="isOrderByDropdownOpen">
        <!-- Sorting options -->
        <div class="px-3 py-2 border-bottom">
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Sort</span>
            <button class="btn btn-sm btn-link p-0 text-decoration-none" (click)="toggleDirection($event)">
              {{ orderByDirection === 'asc' ? 'Ascending' : 'Descending' }}
              <i class="fas ms-1" [ngClass]="getDirectionIcon()"></i>
            </button>
          </div>
        </div>
        <!-- Order by options -->
        <div>
          <a *ngFor="let option of orderByOptions" 
             class="dropdown-item" 
             href="javascript:void(0)" 
             (click)="selectOrderBy(option, $event)"
             [class.active]="selectedOrderBy === option.value">
            {{ option.label }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
