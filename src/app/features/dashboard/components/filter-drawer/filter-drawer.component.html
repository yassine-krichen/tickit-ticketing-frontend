<div
  class="offcanvas offcanvas-end"
  [class.show]="isOpen"
  tabindex="-1"
  id="filterDrawer"
>
  <!-- Backdrop -->
  <div class="offcanvas-backdrop fade show" *ngIf="isOpen"></div>

  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Filter Tickets</h5>
    <button
      type="button"
      class="btn-close text-reset"
      (click)="closeDrawer()"
      aria-label="Close"
    ></button>
  </div>

  <div class="offcanvas-body">
    <!-- Clear Filters Button -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <span class="text-muted small">
        <i class="fas fa-filter me-1"></i>
        Selected filters:
        {{
          selectedPriorities.length +
            selectedStatuses.length +
            selectedTypes.length +
            selectedSteps.length
        }}
      </span>
      <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
        <i class="fas fa-times me-1"></i> Clear Filters
      </button>
    </div>

    <!-- Priority Filter -->
    <div class="mb-4">
      <h6 class="mb-3">
        <i class="fas fa-exclamation-triangle me-2"></i>Priority
      </h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let priority of priorities"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isPrioritySelected(priority)"
          [class.btn-secondary]="isPrioritySelected(priority)"
          (click)="togglePriority(priority)"
        >
          {{ getPriorityLabel(priority) }}
        </button>
      </div>
    </div>

    <!-- Status Filter -->
    <div class="mb-4">
      <h6 class="mb-3"><i class="fas fa-tasks me-2"></i>Status</h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let status of statuses"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isStatusSelected(status)"
          [class.btn-secondary]="isStatusSelected(status)"
          (click)="toggleStatus(status)"
        >
          {{ getStatusLabel(status) }}
        </button>
      </div>
    </div>

    <!-- Type Filter -->
    <div class="mb-4">
      <h6 class="mb-3"><i class="fas fa-sitemap me-2"></i>Case Type</h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let type of caseTypes; trackBy: trackByType"
          class="btn btn-sm position-relative"
          [class.btn-outline-primary]="!isTypeSelected(type)"
          [class.btn-primary]="isTypeSelected(type)"
          (click)="toggleType(type)"
        >
          {{ getCaseTypeLabel(type) }}
          <!-- Show step count badge if type has steps and some are selected -->
          <span
            *ngIf="getSelectedStepsCountForType(type) > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark"
            style="font-size: 0.6em"
            >{{ getSelectedStepsCountForType(type) }}</span
          >
        </button>
      </div>
    </div>

    <!-- Step Filter - Grouped by Type -->
    <div class="mb-4">
      <h6 class="mb-3"><i class="fas fa-list-ol me-2"></i>Case Steps</h6>

      <!-- Grouped by type (collapsible) -->
      <div class="accordion" id="stepsAccordion">
        <div
          class="accordion-item border mb-2 rounded"
          *ngFor="
            let group of stepsGroupedByType;
            let i = index;
            trackBy: trackByGroup
          "
        >
          <h6 class="accordion-header" [id]="'heading' + i">
            <button
              class="accordion-button collapsed py-2 d-flex justify-content-between align-items-center"
              type="button"
              (click)="toggleCollapse(i)"
              [attr.aria-expanded]="false"
              [attr.aria-controls]="'collapse' + i"
            >
              <div class="d-flex align-items-center">
                <span class="text-muted me-2">{{ group.typeLabel }} Steps</span>
                <span
                  class="badge bg-secondary"
                  [class.bg-primary]="
                    getSelectedStepsCountForType(group.type) > 0
                  "
                >
                  {{ getSelectedStepsCountForType(group.type) }}/{{
                    group.steps.length
                  }}
                </span>
              </div>
            </button>
          </h6>
          <div
            [id]="'collapse' + i"
            class="accordion-collapse collapse"
            [attr.aria-labelledby]="'heading' + i"
            data-bs-parent="#stepsAccordion"
          >
            <div class="accordion-body py-2">
              <!-- Select All/None toggle for this type -->
              <div class="mb-2">
                <button
                  class="btn btn-sm"
                  [class.btn-outline-success]="
                    !areAllStepsSelectedForType(group.type)
                  "
                  [class.btn-success]="areAllStepsSelectedForType(group.type)"
                  (click)="toggleAllStepsForType(group.type)"
                >
                  <i class="fas fa-check-double me-1"></i>
                  {{
                    areAllStepsSelectedForType(group.type)
                      ? "Deselect All"
                      : "Select All"
                  }}
                </button>
              </div>

              <!-- Individual step buttons -->
              <div class="d-flex flex-wrap gap-2">
                <button
                  *ngFor="let step of group.steps; trackBy: trackByStep"
                  class="btn btn-sm"
                  [class.btn-outline-secondary]="!isStepSelected(step)"
                  [class.btn-secondary]="isStepSelected(step)"
                  (click)="toggleStep(step)"
                >
                  {{ getCaseStepLabel(step) }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
