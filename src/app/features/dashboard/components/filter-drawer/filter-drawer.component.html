<div
  class="offcanvas offcanvas-end"
  [class.show]="isOpen"
  tabindex="-1"
  id="filterDrawer"
>
  <!-- Backdrop - don't use click handler on backdrop -->
  <div class="offcanvas-backdrop fade show" *ngIf="isOpen"></div>

  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Filter Tickets</h5>
    <button
      type="button"
      class="btn-close text-reset"
      (click)="closeDrawer()"
      aria-label="Close"
    ></button>
  </div>

  <div class="offcanvas-body">
    <!-- Clear Filters Button -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <span class="text-muted small">
        <i class="fas fa-filter me-1"></i>
        Selected filters:
        {{
          selectedPriorities.length +
            selectedStatuses.length +
            selectedTypes.length +
            selectedSteps.length
        }}
      </span>
      <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
        <i class="fas fa-times me-1"></i> Clear Filters
      </button>
    </div>

    <!-- Priority Filter -->
    <div class="mb-4">
      <h6 class="mb-3">Priority</h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let priority of priorities"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isPrioritySelected(priority)"
          [class.btn-secondary]="isPrioritySelected(priority)"
          (click)="togglePriority(priority)"
        >
          {{ getPriorityLabel(priority) }}
        </button>
      </div>
    </div>

    <!-- Status Filter -->
    <div class="mb-4">
      <h6 class="mb-3">Status</h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let status of statuses"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isStatusSelected(status)"
          [class.btn-secondary]="isStatusSelected(status)"
          (click)="toggleStatus(status)"
        >
          {{ getStatusLabel(status) }}
        </button>
      </div>
    </div>

    <!-- Type Filter -->
    <div class="mb-4">
      <h6 class="mb-3">Case Type</h6>
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let type of caseTypes"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isTypeSelected(type)"
          [class.btn-secondary]="isTypeSelected(type)"
          (click)="toggleType(type)"
        >
          {{ getCaseTypeLabel(type) }}
        </button>
      </div>
    </div>

    <!-- Step Filter - Grouped by Type -->
    <div class="mb-4">
      <h6 class="mb-3">Case Steps</h6>

      <!-- Show all steps in a simple list -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button
          *ngFor="let step of caseSteps"
          class="btn btn-sm"
          [class.btn-outline-secondary]="!isStepSelected(step)"
          [class.btn-secondary]="isStepSelected(step)"
          (click)="toggleStep(step)"
        >
          {{ getCaseStepLabel(step) }}
        </button>
      </div>

      <!-- Or show grouped by type (collapsible) -->
      <div class="accordion accordion-flush" id="stepsAccordion">
        <div
          class="accordion-item"
          *ngFor="let group of stepsGroupedByType; let i = index"
        >
          <h6 class="accordion-header" [id]="'heading' + i">
            <button
              class="accordion-button collapsed py-2"
              type="button"
              data-bs-toggle="collapse"
              [data-bs-target]="'#collapse' + i"
              aria-expanded="false"
              [aria-controls]="'collapse' + i"
            >
              <small class="text-muted">{{ group.typeLabel }} Steps</small>
            </button>
          </h6>
          <div
            [id]="'collapse' + i"
            class="accordion-collapse collapse"
            [aria-labelledby]="'heading' + i"
            data-bs-parent="#stepsAccordion"
          >
            <div class="accordion-body py-2">
              <div class="d-flex flex-wrap gap-2">
                <button
                  *ngFor="let step of group.steps"
                  class="btn btn-sm"
                  [class.btn-outline-secondary]="!isStepSelected(step)"
                  [class.btn-secondary]="isStepSelected(step)"
                  (click)="toggleStep(step)"
                >
                  {{ getCaseStepLabel(step) }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
