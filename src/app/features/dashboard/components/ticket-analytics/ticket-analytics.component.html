<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="card-title mb-0">AI System Analysis</h5>
      <button
        class="btn btn-primary"
        (click)="generateAnalysis()"
        [disabled]="loading"
      >
        <i class="fas fa-robot me-2"></i>
        {{ loading ? "Analyzing..." : "Generate Analysis" }}
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-muted mt-2">Analyzing system data...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-circle me-2"></i>
      {{ error }}
    </div>

    <!-- Results -->
    <div *ngIf="analysis" class="analysis-results">
      <div class="meta-info mb-3 text-muted small">
        <i class="fas fa-clock me-1"></i>
        Generated on: {{ analysis.timestamp | date : "medium" }} |
        <i class="fas fa-chart-bar me-1"></i>
        {{ analysis.dataPoints }} data points analyzed
      </div>

      <div
        class="analysis-content"
        [innerHTML]="analysis.analysis | lineBreaks"
      ></div>
    </div>
  </div>
</div>
