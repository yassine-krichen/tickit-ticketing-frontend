<div class="dashboard-navbar">
    <div class="container-fluid px-3">
        <div class="d-flex justify-content-between align-items-center py-2">
            <!-- Welcome Message with dynamic username -->
            <div class="text-muted small mb-0">
                <ng-container *ngIf="loading">
                    <span>Loading...</span>
                </ng-container>
                <ng-container *ngIf="!loading && !errorMessage">
                    Welcome back, <span class="fw-bold text-dark">{{ getUserName() }}</span>
                </ng-container>
                <ng-container *ngIf="!loading && errorMessage">
                    <span class="text-danger">{{ errorMessage }}</span>
                </ng-container>
            </div>
            
            <!-- Right Actions -->
            <div class="d-flex align-items-center">
                <!-- Notifications Dropdown -->
                <div class="custom-dropdown me-2">
                    <button class="btn-icon position-relative" type="button" 
                            (click)="toggleNotifications($event)" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
                        <span class="connection-indicator" [ngClass]="isSocketConnected ? 'connected' : 'disconnected'"
                              title="{{isSocketConnected ? 'Connected' : 'Disconnected'}}"></span>
                    </button>
                    <div class="dropdown-menu shadow-sm notification-dropdown" [class.show]="notificationsOpen">
                        <div class="dropdown-header d-flex justify-content-between align-items-center">
                            <span class="fw-medium">Notifications</span>
                            <div>
                                <span class="badge bg-primary rounded-pill ms-2" *ngIf="unreadCount > 0">{{ unreadCount }} New</span>
                                <button class="btn btn-link btn-sm p-0 ms-2" 
                                        (click)="markAllAsRead($event)" 
                                        *ngIf="unreadCount > 0"
                                        title="Mark all as read">
                                    <i class="fas fa-check-double"></i>
                                </button>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        
                        <!-- Empty notification state -->
                        <div class="dropdown-item text-center p-3" *ngIf="notifications.length === 0">
                            <i class="fas fa-bell text-muted fa-lg mb-2"></i>
                            <p class="text-muted mb-0">No notifications yet</p>
                        </div>
                        
                        <!-- Notification Items -->
                        <div class="notification-scrollable" *ngIf="notifications.length > 0">
                            <a href="#" class="dropdown-item notification-item" 
                               *ngFor="let notification of notifications.slice(0, 5)"
                               [class.unread]="!notification.readFlag"
                               (click)="navigateToNotification(notification, $event)">
                                <div class="notification-icon" [ngClass]="getNotificationColorClass(notification.type)">
                                    <i [class]="getNotificationIcon(notification.type) + ' text-' + notification.type.toLowerCase().split('_')[0]"></i>
                                </div>
                                <div class="notification-content">
                                    <p class="mb-0">{{ notification.message }}</p>
                                    <span class="notification-time">{{ formatRelativeTime(notification.createdAt) }}</span>
                                </div>
                                <button class="notification-action" 
                                        *ngIf="!notification.readFlag"
                                        (click)="markAsRead(notification, $event)"
                                        title="Mark as read">
                                    <i class="fas fa-check"></i>
                                </button>
                            </a>
                        </div>
                        
                        <div class="dropdown-divider" *ngIf="notifications.length > 0"></div>
                        <a href="#" class="dropdown-item text-center view-all" 
                           (click)="viewAllNotifications($event)">View all notifications</a>
                    </div>
                </div>
                
                <!-- User Profile Dropdown -->
                <div class="custom-dropdown">
                    <button class="btn-icon profile-btn" type="button"
                            (click)="toggleUserMenu($event)" title="User menu">
                        <i class="fas fa-user"></i>
                    </button>
                    <div class="dropdown-menu shadow-sm profile-dropdown" [class.show]="userMenuOpen">
                        <div class="dropdown-header d-flex align-items-center">
                            <div class="profile-icon me-2">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div>
                                <strong>{{ getUserName() }}</strong>
                                <div class="small text-muted">{{getUserRole()}}</div>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>

                        <a class="dropdown-item" href="https://sof-tunisie.sofrecom.fr/fr" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-question-circle me-2 text-muted"></i> Help Center
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-danger" href="#" (click)="logout(); $event.preventDefault()">
                            <i class="fas fa-sign-out-alt me-2"></i> Log Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
