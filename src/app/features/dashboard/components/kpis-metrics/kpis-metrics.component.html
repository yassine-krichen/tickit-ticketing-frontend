<div class="row g-3">
  <div class="col-lg-3 col-md-6" *ngFor="let kpi of kpis">
    <div class="card border border-light shadow-sm h-100">
      <div class="card-body d-flex flex-column justify-content-center align-items-center">
        <div class="rounded-circle d-flex justify-content-center align-items-center mb-3 metric-icon"
             [ngClass]="'bg-' + kpi.colorClass + '-light'">
          <i [class]="kpi.icon + ' fa-lg text-' + kpi.colorClass"></i>
        </div>
        <div class="text-center">
          <div class="text-muted small">{{ kpi.title }}</div>
          <div class="fs-4 fw-bold">{{ kpi.value() }}</div>
          
          <!-- Month-over-Month Comparison Badge -->
          <div class="badge bg-light mt-2" [ngClass]="getMoMClass(kpi.momPercentage, kpi.title)" *ngIf="kpi.momPercentage !== null">
            <i [class]="getMoMIcon(kpi.momPercentage, kpi.title)"></i> 
            {{ formatMoMPercentage(kpi.momPercentage) }} MoM
          </div>
          
          <!-- Show "First Month" badge when no MoM data is available -->
          <div class="badge bg-light text-secondary mt-2" *ngIf="kpi.momPercentage === null">
            <i class="fas fa-calendar-alt"></i> First Month
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
