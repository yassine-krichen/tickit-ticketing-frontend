<div class="list-group-item border-0 border-bottom py-3"
[routerLink]="['/ticket-details', ticket.id]">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div class="fw-monospace text-muted small">
      <i class="fas fa-hashtag fa-xs me-1"></i>{{ ticket.id }}
    </div>
    <div class="d-flex gap-2">
      <app-ticket-status-badge [status]="ticket.status"></app-ticket-status-badge>
      <app-ticket-priority-badge [priority]="ticket.priority"></app-ticket-priority-badge>
      <app-ticket-actions 
        [ticketId]="ticket.id"
        (toggleDropdown)="onToggleDropdown($event, ticket.id)"
        (delete)="onDelete(ticket)">
      </app-ticket-actions>
    </div>
  </div>
  
  <app-ticket-meta [ticket]="ticket"></app-ticket-meta>
  
  <h6 class="mb-3">
    <i class="fas fa-clipboard-check me-2 text-primary"></i>{{ ticket.subject }}
  </h6>
  
  <div class="d-flex flex-wrap justify-content-between align-items-end">
    <div class="text-muted small">
      <div><i class="far fa-calendar-alt me-1"></i> Created: {{ ticket.createdAt | date:'medium' }}</div>
      <app-ticket-assignee [assignee]="ticket.issuedBy"></app-ticket-assignee>
    </div>
  </div>
</div>
