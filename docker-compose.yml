version: "3.8"

services:
  tickit-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4201:80"
    environment:
      - API_URL=http://localhost:8080
      - PRODUCTION=false
    container_name: tickit-frontend
    restart: unless-stopped

  # Uncomment if you want to run with a backend service
  # tickit-backend:
  #   image: your-backend-image:latest
  #   ports:
  #     - "8080:8080"
  #   container_name: tickit-backend
  #   restart: unless-stopped
